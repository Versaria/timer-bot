name: Java CI with Maven

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'zulu'
          cache: 'maven'

      - name: Validate and build with Maven
        run: |
          mvn clean compile
          mvn package -DskipTests

      - name: Verify JAR creation
        run: |
          ls -la target/
          if [ -f "target/timer-bot-1.0.0-jar-with-dependencies.jar" ]; then
            echo "✅ JAR файл успешно создан"
          else
            echo "❌ Ошибка: JAR файл не создан"
            exit 1
          fi